<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 360px; font-family: Arial, sans-serif; margin: 0; background-color: #f9f9f9; }
    .tabs { display: flex; background: #e0e0e0; border-bottom: 1px solid #ccc; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: none; cursor: pointer; font-weight: bold; color: #555; transition: 0.2s; }
    .tab-btn:hover { background: #d5d5d5; }
    .tab-btn.active { background: #fff; border-bottom: 2px solid #0056b3; color: #0056b3; }
    .tab-content { padding: 15px; background: #fff; display: none; }
    .tab-content.active { display: block; }
    h3 { margin-top: 0; font-size: 14px; color: #333; }
    textarea { width: 100%; height: 220px; padding: 10px; box-sizing: border-box; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical; }
    .btn { width: 100%; padding: 12px; color: #fff; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
    #fillBtn { background: #0056b3; } #fillBtn:hover { background: #004494; }
    #fillOfficerBtn { background: #28a745; } #fillOfficerBtn:hover { background: #218838; }
    .credit { text-align: center; padding-bottom: 15px; font-size: 11px; color: #888; background: #fff; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" data-tab="citizen">👤 Công Dân</button>
    <button class="tab-btn" data-tab="officer">👮 Cán Bộ</button>
  </div>
  <div id="citizen" class="tab-content active">
    <h3>Dán dữ liệu hồ sơ Công dân:</h3>
    <textarea id="dataInputCitizen" placeholder="HỌ VÀ TÊN&#10;Nguyễn Văn A..."></textarea>
    <button id="fillBtn" class="btn">Bắt đầu điền Form</button>
  </div>
  <div id="officer" class="tab-content">
    <h3>Dán dữ liệu hồ sơ Công dân:</h3>
    <textarea id="dataInputOfficer" placeholder="HỌ VÀ TÊN&#10;Nguyễn Văn A..."></textarea>
    <button id="fillOfficerBtn" class="btn">Bắt đầu điền Form</button>
  </div>
  <div class="credit">Credit: <strong>Cao Tiến Hưng</strong><br>Sở Nội Vụ Quảng Ngãi</div>
  <script src="popup.js"></script>
</body>
</html>
